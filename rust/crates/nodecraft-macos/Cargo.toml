[package]
name = "nodecraft-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NodeCraft's audited macOS Objective-C boundary"
publish = false

[dependencies]
egui = "0.36"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSNotification", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }
