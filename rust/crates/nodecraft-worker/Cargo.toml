[package]
name = "nodecraft-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nodecraft-worker"
path = "src/main.rs"

[features]
default = []
mesher-ours = []
mesher-upstream = ["nodecraft-engine/mesher-upstream", "nodecraft-session/mesher-upstream"]

[dependencies]
nodecraft-engine = { path = "../nodecraft-engine", default-features = false }
nodecraft-session = { path = "../nodecraft-session", default-features = false }
nodecraft-protocol = { path = "../nodecraft-protocol" }
serde_json.workspace = true
serde = { workspace = true }
