[workspace]
members = [
  "apps/nodecraft-egui",
  "crates/nodecraft-protocol",
  "crates/nodecraft-node-contract",
  "crates/nodecraft-kernel",
  "crates/nodecraft-worker",
  "crates/nodecraft-engine",
  "crates/nodecraft-mesh",
  "crates/nodecraft-layers",
  "crates/nodecraft-sweep",
  "crates/nodecraft-search",
  "crates/nodecraft-dock",
  "crates/nodecraft-session",
  "crates/nodecraft-solidcore",
  "crates/nodecraft-wedge",
  "crates/nodecraft-bool",
  "crates/nodecraft-extrude",
  "crates/nodecraft-blend",
  "crates/nodecraft-step",
  "crates/step-schema",
  "crates/step-conics",
  "crates/step-assemblies",
  "crates/step-nurbs",
  "crates/nodecraft-cli",
  "crates/solidcore-stepio",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
nurbs-grid-mesh = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
step-import = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
step-brep = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
step-export = { git = "https://github.com/tangency-labs/solidcore", rev = "a39659e3d798b56f99266cd2e522360dd99f7cf7" }
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "d7cad1005a7ab8ed948d7c8cca666230e988c579" }
