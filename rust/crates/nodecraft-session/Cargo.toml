[package]
name = "nodecraft-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nodecraft_session"
path = "src/lib.rs"

[features]
default = []
mesher-ours = []
mesher-upstream = ["nodecraft-engine/mesher-upstream"]

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
nodecraft-engine = { path = "../nodecraft-engine", default-features = false }
nodecraft-protocol = { path = "../nodecraft-protocol" }
nodecraft-node-contract = { path = "../nodecraft-node-contract" }
