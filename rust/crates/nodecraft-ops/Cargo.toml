[dev-dependencies]
nodecraft-bool = { path = "../nodecraft-bool" }
nodecraft-layers = { path = "../nodecraft-layers" }
# The proof-count tests read ops' per-call kernel profile (session::profiled).
solidcore-ops = { workspace = true, features = ["profile"] }
