[workspace]
members = [
  "apps/nodecraft",
  "crates/nodecraft-protocol",
  "crates/nodecraft-node-contract",
  "crates/nodecraft-kernel",
  "crates/nodecraft-worker",
  "crates/nodecraft-engine",
  "crates/nodecraft-mesh",
  "crates/nodecraft-layers",
  "crates/nodecraft-sweep",
  "crates/nodecraft-search",
  "crates/nodecraft-macos",
  "crates/nodecraft-expr",
  "crates/nodecraft-dock",
  "crates/nodecraft-session",
  "crates/nodecraft-solidcore",
  "crates/nodecraft-wedge",
  "crates/nodecraft-bool",
  "crates/nodecraft-extrude",
  "crates/nodecraft-blend",
  "crates/nodecraft-step",
  "crates/step-schema",
  "crates/step-conics",
  "crates/step-assemblies",
  "crates/step-nurbs",
  "crates/nodecraft-cli",
  "crates/solidcore-stepio",
]
resolver = "2"

[profile.release]
# Keep file:line frames in release crash reports (the panic location is always
# available; line tables make the surrounding stack useful too).
debug = "line-tables-only"

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
nurbs-grid-mesh = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
step-import = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
step-brep = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
step-export = { git = "https://github.com/tangency-labs/solidcore", rev = "0249e8e07238ec7faa756831d5181586d7b0b284" }
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "871014f955a76fd308ce156e68c93e6372906005" }
