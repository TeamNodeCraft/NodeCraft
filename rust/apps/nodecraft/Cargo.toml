[package]
name = "nodecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NodeCraft native front end"
publish = false

[features]
default = ["gpu-viewport"]
# The wgpu viewport is being ported from SolidCraft. It is kept optional until the
# adapter lands so the first app shell can build without a GPU pipeline.
gpu-viewport = ["dep:solidcraft-viewport-gpu"]
# Opt-in external Tracy GPU profiling. Off by default so normal builds pay
# nothing and do not link the Tracy client.
tracy = ["wgpu-profiler/tracy"]

[dependencies]
nodecraft-crash = { path = "../../crates/nodecraft-crash" }
nodecraft-kernel-profile = { path = "../../crates/nodecraft-kernel-profile" }
egui = "0.36"
eframe = { version = "0.36", features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "__screenshot"] }
egui-wgpu = "0.36"
egui_plot = "=0.37.0"
# GPU pass timings through timer queries. Its wgpu dependency is v30, matching
# eframe/egui-wgpu 0.36, so the profiler shares our device.
wgpu-profiler = "=0.28.0"
rfd = "0.17"
arboard = "3"
image = { version = "0.25", features = ["png"] }
egui_extras = { version = "0.36", features = ["svg"] }
bytemuck = "1"
mimalloc = { version = "0.1" }
lyon = "1.0"
glyphon = "0.12"
serde = { workspace = true }
serde_json.workspace = true
nodecraft-engine = { path = "../../crates/nodecraft-engine" }
nodecraft-display = { path = "../../crates/nodecraft-display" }
nodecraft-step = { path = "../../crates/nodecraft-step" }
nodecraft-mesh = { path = "../../crates/nodecraft-mesh" }
nodecraft-layers = { path = "../../crates/nodecraft-layers" }
nodecraft-protocol = { path = "../../crates/nodecraft-protocol" }
nodecraft-exact = { path = "../../crates/nodecraft-exact" }
nodecraft-session = { path = "../../crates/nodecraft-session" }
nodecraft-node-canvas = { path = "../../crates/nodecraft-node-canvas" }
nodecraft-node-contract = { path = "../../crates/nodecraft-node-contract" }
nodecraft-expr = { path = "../../crates/nodecraft-expr" }
nodecraft-search = { path = "../../crates/nodecraft-search" }
nodecraft-dock = { path = "../../crates/nodecraft-dock" }
nodecraft-color-picker = { path = "../../crates/nodecraft-color-picker" }
# One app-wide file watcher. Pinned to the latest stable release older than two
# weeks at the time of writing (8.2.2 was too new).
notify = "=8.2.1"
nodecraft-worker = { path = "../../crates/nodecraft-worker" }
# Upstream view math/geometry. Keep these as git dependencies so they can be
# updated independently of the app; only our UI adapter lives in this repository.
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft", rev = "1fc00b615667a37b138b4397aafb62561f9932d1" }
solidcraft-viewport = { git = "https://github.com/tangency-labs/solidcraft", rev = "1fc00b615667a37b138b4397aafb62561f9932d1" }
solidcraft-viewport-gpu = { git = "https://github.com/tangency-labs/solidcraft", rev = "1fc00b615667a37b138b4397aafb62561f9932d1", optional = true }
solidcore-record = { workspace = true }
glam = { version = "0.30", features = ["bytemuck"] }

[target.'cfg(target_os = "macos")'.dependencies]
nodecraft-macos = { path = "../../crates/nodecraft-macos" }

[dev-dependencies]
pollster = "1"
nodecraft-solidcore = { path = "../../crates/nodecraft-solidcore" }
