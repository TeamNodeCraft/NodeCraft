[workspace]
members = [
  "apps/nodecraft",
  "crates/nodecraft-protocol",
  "crates/nodecraft-exact",
  "crates/nodecraft-node-contract",
  "crates/nodecraft-kernel",
  "crates/nodecraft-worker",
  "crates/nodecraft-engine",
  "crates/nodecraft-display",
  "crates/nodecraft-mesh",
  "crates/nodecraft-layers",
  "crates/nodecraft-sweep",
  "crates/nodecraft-search",
  "crates/nodecraft-macos",
  "crates/nodecraft-expr",
  "crates/nodecraft-dock",
  "crates/nodecraft-color-picker",
  "crates/nodecraft-session",
  "crates/nodecraft-solidcore",
  "crates/nodecraft-kernel-profile",
  "crates/nodecraft-wedge",
  "crates/nodecraft-bool",
  "crates/nodecraft-extrude",
  "crates/nodecraft-blend",
  "crates/nodecraft-step",
  "crates/step-schema",
  "crates/step-conics",
  "crates/step-assemblies",
  "crates/step-nurbs",
  "crates/nodecraft-cli",
]
resolver = "2"

[profile.release]
# Keep file:line frames in release crash reports (the panic location is always
# available; line tables make the surrounding stack useful too).
debug = "line-tables-only"

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solidcore = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
step-export = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "525171eb861f172bdc1e23c7c5c070a44a8fc831" }
