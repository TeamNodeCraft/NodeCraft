[package]
name = "nodecraft-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Kept as no-op feature names for existing build commands. The upstream
# nurbs-grid-mesh used by default is always the latest pinned SolidCore crate.
mesher-ours = []
mesher-upstream = []

[dependencies]
solidcore = { workspace = true }
nurbs-grid-mesh = { workspace = true }
nodecraft-protocol = { path = "../nodecraft-protocol" }
nodecraft-step = { path = "../nodecraft-step" }
step-assemblies = { path = "../step-assemblies" }
step-import = { workspace = true }
step-brep = { workspace = true }
serde_json = "1"
