name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan-dev \
            libgtk-3-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml -p nodecraft-egui
      - name: Test application and editor
        run: >-
          cargo test --manifest-path rust/Cargo.toml
          -p nodecraft-egui -p nodecraft-node-canvas -p nodecraft-session
          -p nodecraft-layers
