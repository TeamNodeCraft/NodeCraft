[package]
name = "nodecraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nodecraft_engine"
path = "src/lib.rs"

[features]
default = []
mesher-ours = []
mesher-upstream = ["nodecraft-mesh/mesher-upstream", "nodecraft-solidcore/mesher-upstream"]

[dependencies]
nodecraft-protocol = { path = "../nodecraft-protocol" }
nodecraft-node-contract = { path = "../nodecraft-node-contract" }
nodecraft-layers = { path = "../nodecraft-layers" }
nodecraft-sweep = { path = "../nodecraft-sweep" }
solidcore-convert = { workspace = true }
solidcore-record = { workspace = true }
solidcore-record-new = { package = "solidcore-record", git = "https://github.com/tangency-labs/solidcore", rev = "f5e8e9a29e0c9b7cf6c4040a5bc8878382b3c62f" }
nodecraft-mesh = { path = "../nodecraft-mesh", default-features = false }
nodecraft-kernel = { path = "../nodecraft-kernel" }
nodecraft-solidcore = { path = "../nodecraft-solidcore", default-features = false }
nodecraft-wedge = { path = "../nodecraft-wedge" }
nodecraft-step = { path = "../nodecraft-step" }
nodecraft-extrude = { path = "../nodecraft-extrude" }
nodecraft-bool = { path = "../nodecraft-bool" }
nodecraft-blend = { path = "../nodecraft-blend" }
step-nurbs = { path = "../step-nurbs" }
step-schema = { path = "../step-schema" }
step-assemblies = { path = "../step-assemblies" }
solidcraft-sketch.workspace = true
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft", rev = "481687fff38057691faf84a6fd844e826c552a6c" }
serde_json.workspace = true
base64 = "0.22"
