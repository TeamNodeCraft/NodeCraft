[workspace]
members = [
  "apps/nodecraft-egui",
  "crates/nodecraft-protocol",
  "crates/nodecraft-node-contract",
  "crates/nodecraft-kernel",
  "crates/nodecraft-worker",
  "crates/nodecraft-engine",
  "crates/nodecraft-mesh",
  "crates/nodecraft-layers",
  "crates/nodecraft-sweep",
  "crates/nodecraft-search",
  "crates/nodecraft-dock",
  "crates/nodecraft-session",
  "crates/nodecraft-solidcore",
  "crates/nodecraft-wedge",
  "crates/nodecraft-bool",
  "crates/nodecraft-extrude",
  "crates/nodecraft-blend",
  "crates/nodecraft-step",
  "crates/step-schema",
  "crates/step-conics",
  "crates/step-assemblies",
  "crates/step-nurbs",
  "crates/nodecraft-cli",
  "crates/solidcore-stepio",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
nurbs-grid-mesh = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
step-import = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
step-brep = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
step-export = { git = "https://github.com/tangency-labs/solidcore", rev = "d93a19bd4e0ca3b141cc028ca73f9cc80be38efe" }
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "481687fff38057691faf84a6fd844e826c552a6c" }
