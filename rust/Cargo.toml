[workspace]
members = [
  "apps/nodecraft-egui",
  "crates/nodecraft-protocol",
  "crates/nodecraft-kernel",
  "crates/nodecraft-worker",
  "crates/nodecraft-engine",
  "crates/nodecraft-mesh",
  "crates/nodecraft-session",
  "crates/nodecraft-solidcore",
  "crates/nodecraft-wedge",
  "crates/nodecraft-bool",
  "crates/nodecraft-extrude",
  "crates/nodecraft-blend",
  "crates/nodecraft-step",
  "crates/step-schema",
  "crates/step-conics",
  "crates/step-assemblies",
  "crates/step-nurbs",
  "crates/nodecraft-cli",
  "crates/solidcore-mesh",
  "crates/solidcore-stepio",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solidcore = { git = "https://github.com/tangency-labs/solidcore", branch = "main" }
nurbs-grid-mesh = { git = "https://github.com/tangency-labs/solidcore", branch = "main" }
step-import = { git = "https://github.com/tangency-labs/solidcore", branch = "main" }
step-brep = { git = "https://github.com/tangency-labs/solidcore", branch = "main" }
step-export = { git = "https://github.com/tangency-labs/solidcore", branch = "main" }
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", branch = "develop" }
