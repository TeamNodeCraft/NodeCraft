[package]
name = "nodecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NodeCraft native front end"
publish = false

[features]
default = ["gpu-viewport"]
# The wgpu viewport is being ported from SolidCraft. It is kept optional until the
# adapter lands so the first app shell can build without a GPU pipeline.
gpu-viewport = ["dep:solidcraft-gpu"]

[dependencies]
egui = "0.36"
eframe = { version = "0.36", features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "__screenshot"] }
egui-wgpu = "0.36"
rfd = "0.17"
arboard = "3"
image = { version = "0.25", features = ["png"] }
egui_extras = { version = "0.36", features = ["svg"] }
bytemuck = "1"
mimalloc = { version = "0.1" }
lyon = "1.0"
glyphon = "0.12"
serde = { workspace = true }
serde_json.workspace = true
nodecraft-engine = { path = "../../crates/nodecraft-engine" }
nodecraft-step = { path = "../../crates/nodecraft-step" }
nodecraft-mesh = { path = "../../crates/nodecraft-mesh" }
nodecraft-protocol = { path = "../../crates/nodecraft-protocol" }
nodecraft-session = { path = "../../crates/nodecraft-session" }
nodecraft-node-canvas = { path = "../../crates/nodecraft-node-canvas" }
nodecraft-node-contract = { path = "../../crates/nodecraft-node-contract" }
nodecraft-expr = { path = "../../crates/nodecraft-expr" }
nodecraft-search = { path = "../../crates/nodecraft-search" }
nodecraft-dock = { path = "../../crates/nodecraft-dock" }
nodecraft-color-picker = { path = "../../crates/nodecraft-color-picker" }
nodecraft-worker = { path = "../../crates/nodecraft-worker" }
# Upstream view math/geometry. Keep these as git dependencies so they can be
# updated independently of the app; only our UI adapter lives in this repository.
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft", rev = "9b559c4c0727b2c626622d86e00e7d4c63f52400" }
solidcraft-render = { git = "https://github.com/tangency-labs/solidcraft", rev = "9b559c4c0727b2c626622d86e00e7d4c63f52400" }
solidcraft-gpu = { git = "https://github.com/tangency-labs/solidcraft", rev = "9b559c4c0727b2c626622d86e00e7d4c63f52400", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nodecraft-macos = { path = "../../crates/nodecraft-macos" }

solidcore-record = { workspace = true }
