[workspace]
members = [
  "apps/nodecraft",
  "crates/nodecraft-crash",
  "crates/nodecraft-protocol",
  "crates/nodecraft-exact",
  "crates/nodecraft-node-contract",
  "crates/nodecraft-kernel",
  "crates/nodecraft-worker",
  "crates/nodecraft-engine",
  "crates/nodecraft-display",
  "crates/nodecraft-ops",
  "crates/nodecraft-mesh",
  "crates/nodecraft-layers",
  "crates/nodecraft-sweep",
  "crates/nodecraft-search",
  "crates/nodecraft-macos",
  "crates/nodecraft-expr",
  "crates/nodecraft-dock",
  "crates/nodecraft-color-picker",
  "crates/nodecraft-session",
  "crates/nodecraft-solidcore",
  "crates/nodecraft-kernel-profile",
  "crates/nodecraft-wedge",
  "crates/nodecraft-bool",
  "crates/nodecraft-extrude",
  "crates/nodecraft-blend",
  "crates/nodecraft-step",
  "crates/nodecraft-cli",
]
resolver = "2"

[profile.release]
# Keep file:line frames in release crash reports (the panic location is always
# available; line tables make the surrounding stack useful too).
debug = "line-tables-only"

# Test builds run the kernel (SolidCore, solidcore-ops) and its maths unoptimised
# otherwise: 16 shells take 3.9 s in debug against 0.28 s in release, and a single
# G2 fillet can take 167 s. Optimise every non-workspace dependency so the kernel
# is fast under `cargo test`, while our own crates stay debug for quick rebuilds.
[profile.dev.package."*"]
opt-level = 3

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rayon = "1"
serde_json = "1"
solidcore = { git = "https://github.com/tangency-labs/solidcraft", rev = "c5ed6cd004fcb211dd0ce7fd5417b6e4f046221c" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft", rev = "c5ed6cd004fcb211dd0ce7fd5417b6e4f046221c" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcraft", rev = "c5ed6cd004fcb211dd0ce7fd5417b6e4f046221c" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcraft", rev = "c5ed6cd004fcb211dd0ce7fd5417b6e4f046221c" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcraft", rev = "c5ed6cd004fcb211dd0ce7fd5417b6e4f046221c" }
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "c5ed6cd004fcb211dd0ce7fd5417b6e4f046221c" }
# cadmpeg (CADIR) is pinned to exactly the versions and features SolidCraft pins.
cadmpeg-core = "=0.6.12"
cadmpeg-ir = "=0.6.12"
cadmpeg-registry = { version = "=0.6.12", default-features = false, features = ["fcstd", "rhino", "step"] }
cadmpeg-codec-step = "=0.6.12"
# solidcore-cadir is in the pinned revision: SolidCraft PR 16906 merged, so the
# crate now comes from the same git pin as the rest of the kernel and only the
# ops seam remains local. See docs/solidcore-sync.md.
solidcore-cadir = { git = "https://github.com/tangency-labs/solidcraft", rev = "c5ed6cd004fcb211dd0ce7fd5417b6e4f046221c" }


# Run scripts/setup-solidcore-seam.sh first; it creates the local seam checkout.
# The private build reads these packages from that seam. The public snapshot
# exporter rewrites the paths to ../vendor/solidcore/ and vendors the crates.
[patch."https://github.com/tangency-labs/solidcraft"]
solidcore = { path = "../vendor/solidcore/crates/solidcore" }
solidcore-record = { path = "../vendor/solidcore/crates/solidcore-record" }
solidcore-convert = { path = "../vendor/solidcore/crates/solidcore-convert" }
solidcore-tess = { path = "../vendor/solidcore/crates/solidcore-tess" }
solidcore-ops = { path = "../vendor/solidcore/crates/solidcore-ops" }
solidcore-cadir = { path = "../vendor/solidcore/crates/solidcore-cadir" }
